<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="A small-scale Single Page Application built using HTML, CSS and JavaScript."
    >

    <title>NovaSpace - Single Page Application</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Header -->
    <header class="header">

        <div class="container nav-container">

            <a href="/" class="logo" data-link>
                NovaSpace
            </a>

            <button
                class="menu-toggle"
                id="menuToggle"
                type="button"
                aria-label="Open navigation menu"
                aria-expanded="false"
            >
                ☰
            </button>

            <nav
                class="nav"
                id="mainNav"
                aria-label="Main navigation"
            >
                <a href="/" data-link data-route="home">
                    Home
                </a>

                <a href="/about" data-link data-route="about">
                    About
                </a>

                <a href="/services" data-link data-route="services">
                    Services
                </a>

                <a href="/contact" data-link data-route="contact">
                    Contact
                </a>
            </nav>

        </div>

    </header>


    <!-- Main SPA Container -->
    <main
        id="app"
        class="app"
        aria-live="polite"
    >
        <!-- JavaScript dynamically loads page content here -->
    </main>


    <!-- Footer -->
    <footer class="footer">

        <div class="container footer-content">

            <p>
                © 2026 NovaSpace. SPA Project.
            </p>

            <a href="/contact" data-link>
                Get Started
            </a>

        </div>

    </footer>


    <script src="script.js" defer></script>

</body>
</html>
